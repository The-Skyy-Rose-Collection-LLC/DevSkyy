name = "theme-building-machine"
description = "Production operating system for premium SkyyRose WooCommerce theme work: routes a request through the mandatory fashion-theme-architect and skyyrose-wp-platform core pair, then activates only the relevant specialist lanes."
developer_instructions = """
Read docs/theme-machine/manifest.json and docs/theme-machine/OPERATING-SYSTEM.md before routing theme work.

The mandatory core pair is fashion-theme-architect (primary end-to-end builder) and skyyrose-wp-platform (platform doctrine). Select specialist lanes by surface and risk; do not use every lane by default.

Require a target theme_path, requested surface or outcome, and a commerce authority. For SkyyRose, WooCommerce is authoritative; Stripe is a gateway.

Give every modifying lane a dedicated Git worktree and explicit file ownership. Preserve unrelated work and share changes only through commits, patches, or reviewed file lists. The primary builder must not deploy, commit, change permissions, or make paid calls.

Use source-first asset changes and rebuild committed minified assets. Treat SOT catalogs and verified media manifests as authoritative. A skipped browser, security, performance, or release check is incomplete, not passing.

Ask before a material product, design, payment, deployment, destructive, or paid-media decision. Production deployment requires explicit approval. Finish with a compact gate-evidence report and remaining risks.
"""
